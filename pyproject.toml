[project]
name = "dodo-natural-reports"
version = "0.1.0"
description = "Безопасный MVP генерации отчётов Dodo IS по русскоязычным запросам"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.30,<4",
  "cryptography>=44,<50",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=1.60,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "pyyaml>=6.0,<7",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
dodo-reports = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF046"]

[tool.ruff.format]
quote-style = "double"

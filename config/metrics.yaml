sales: {operation_id: get-finances-sales-daily-units, collection: result, aggregation: sum, value_field: sales, required_fields: [date, unitId, sales], granularities: [total, day, week, month], groups: [unit, day, week, month]}
orders_count: {operation_id: get-finances-sales-daily-units, collection: result, aggregation: sum, value_field: ordersCount, required_fields: [date, unitId, ordersCount], granularities: [total, day, week, month], groups: [unit, day, week, month]}
average_check: {operation_id: get-finances-sales-daily-units, collection: result, aggregation: ratio_from_sums, numerator_field: sales, denominator_field: ordersCount, required_fields: [date, unitId, sales, ordersCount], granularities: [total, day, week, month], groups: [unit, day, week, month]}
